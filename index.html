<!DOCTYPE HTML>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <title> Expense Tracker </title>
    </head>
    <body>
        <header class="summary">
            <div class="summary">
                <span>Current Balance</span>
                <span id="current-balance">&#8377; 0.00 </span>
            </div>
            <div class="summary">
                <span>Total Income</span>
                <span id="total-income">&#8377; 0.00 </span>
            </div>
            <div class="summary">
                <span>Total Expense</span>
                <span id="total-expense">&#8377; 0.00 </span>
            </div>
        </header>
        </div>
            <form id="transaction-form">

                <label for="amount">Amount</label>
                <input id="amount" type="number" placeholder="Amount" min="0.1" step="0.01" required>
                <small id = "amount-error" class="error-text"></small>

                <label for="transaction-type">Type</label>
                <select id="transaction-type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                <small id = "type-error" class="error-text"></small>
                </select>

                <label for="category">Category</label>
                <input id="category" type="text" placeholder="category" required>
                <small id = "category-error" class="error-text"></small>

                <label for="date">Date</label>
                <input id="date" type="date" required>
                <small id = "date-error" class="error-text"></small>

                <label for="description">Description</label>
                <textarea id="description" placeholder="Description"></textarea>
                <button type="submit" id="submit-btn">Save</button>
                <button type="button" id="cancel-btn">Clear</button>
            </form>

            <div id="filter-group">
                <label for="type-filter">Filter by Type:</label>
                <select id="type-filter" required>
                    <option value="all">All Transaction</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>
                <label for="category-filter">Filter by Category:</label>
                <select id="category-filter" required>
                    <option value="all">All categories</option>
                </select>
            <ul id="transaction-list"></ul>

            <div id="yearwise-summary">
                <label for="summary-year">Select Year</label>
                <select id="summary-year" required></select>
            </div>
            <div>
                <table id="summary-table">
                    <thead>
                        <tr>
                            <th>Month</th>
                            <th>Income</th>
                            <th>Expense</th>
                            <th>Net</th>
                        </tr>
                    </thead>
                    <tbody id="summary-tbody"></tbody>
                    <tfoot id="summary-tfoot"></tfoot>
                </table>
            </div>

            <section class="chart-section card">
                <div class="chart-header">
                    <h3>Expense Breakdown</h3>
                    <div class="chart-filter-group"></div>

                    <div class="timeframe-group" id="timeframe-controls">
                        <button type="button" class="btn-toggle active" data-timeframe="monthly">Monthly</button>
                        <button type="button" class="btn-toggle" data-timeframe="yearly">Yearly</button>
                        <button type="button" class="btn-toggle" data-timeframe="all">All Time</button>
                    </div>

                    <div class="chart-filters">
                        <select id="chart-month-select" class="select-input">
                        </select>

                        <select id="chart-year-select" class="select-input">
                        </select>
                    </div>

                    <div class="chart-wrapper">
                        <canvas id="expense-chart"></canvas>

                        <div id="chart-empty-state" class="empty-state">
                        <p>📊 No expenses found for this period.</p>
                    </div>
                </div>
            </section>

    </body>
</html>
